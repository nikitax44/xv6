[package]
name = "rust-xv6"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_xv6"
crate-type = ["staticlib"]

[features]
default = []

[dependencies]
buddy_system_allocator = "0.11.0"
talc = { version = "4.4.2", features = ["counters"], optional = true }
fdt = "0.1.5"
zerocopy = { version = "0.8.5", default-features = false, features = ["derive"] }
bytemuck = { version = "1.21.0", features = ["derive", "track_caller"] }
virtio-drivers = "0.7.5"
riscv = { version = "0.11.1", features = ["s-mode"] }
bitflags = "2.6.0"
attr-wrapper = { git = "https://github.com/nikitax44/attr-wrapper" }
thiserror = { version = "2.0.0", default-features = false }
fat32 = "0.2.0"
block_device = "0.1.3"
log = "0.4.22"
critical-section = "1.2.0"
lock_api = "0.4.12"